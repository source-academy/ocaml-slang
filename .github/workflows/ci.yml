name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up OCaml 5.5.2 and the locked packages
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5.2
          dune-cache: true
      - run: opam install . --deps-only --locked
      - name: Check that the opam file matches dune-project
        run: opam exec -- dune build --root . @install # fails if ocaml-slang.opam is out of date
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Build the OCaml toplevel
        run: opam exec -- yarn build:ocaml
      - run: yarn build:evaluator
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn format:ci
      - run: yarn test
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
